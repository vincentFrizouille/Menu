body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:70px}
main{max-width:560px;margin:0 auto;padding:12px 14px}

.c{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:8px 12px;min-height:40px}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ln)}
button.s{padding:2px 8px;min-height:32px}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;width:100%}
input.n{width:70px}
summary{font-weight:600;cursor:pointer}
.t{display:inline-block;font-size:12px;background:var(--ac2);color:#222;border-radius:8px;padding:0 6px;margin-left:4px}
.bad{color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:auto}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;min-width:62px;font-size:12px;padding:8px 2px}
nav button.on{color:var(--ac);font-weight:800;box-shadow:inset 0 3px var(--ac2)}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}

const AV0=["foie","rognon","abats","huître","moule","coquille","crevette","crabe","algue","tournesol","graines de lin","pavot","cacao","chocolat","épinard"];
const ST0=[["papier toilette",2,1],["dentifrice",1,1],["liquide vaisselle",1,1],["lessive",1,1],["sacs poubelle",1,1],["éponges",2,1]];
let S={p:2,tab:"j",wk:0,fav:[],ff:[],av:AV0.slice(),hist:[],plan:{},stock:ST0.map(x=>({n:x[0],q:x[1],min:x[2],c:1})),bud:{w:120,sp:[]},cus:[],pr:{},chk:{},rec:null};
try{const x=localStorage.getItem("menus1");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const sv=()=>{try{localStorage.setItem("menus1",JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,"0"),dk=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const TODAY=new Date(),TK=dk(TODAY),all=()=>R.concat(S.cus),by=n=>all().find(r=>r.n==n);
const lab=d=>d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const txt=r=>(r.n+" "+r.i.map(x=>x[0]).join(" ")).toLowerCase();
const bad=r=>S.av.filter(a=>a&&txt(r).includes(a.toLowerCase()));
const recent=(n,ref)=>S.hist.some(h=>h.n==n&&Math.abs((new Date(ref)-new Date(h.d))/864e5)<14);
const inSeason=(r,d)=>!r.m.length||r.m.includes(d.getMonth()+1);
const q1=x=>Math.round(x*10)/10,esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function gen(from,n){const used=new Set(Object.entries(S.plan).filter(([k])=>Math.abs((new Date(k)-from)/864e5)<14).flatMap(([,v])=>[v.r,v.g]));
 const pick=(t,d)=>{const c=all().filter(r=>r.t==t&&!bad(r).length&&inSeason(r,d)&&!used.has(r.n)&&!recent(r.n,dk(d)));
  if(!c.length)return null;const sc=r=>Math.random()+(S.fav.includes(r.n)?.6:0)+(S.ff.some(f=>txt(r).includes(f.toLowerCase()))?.4:0);
  c.sort((a,b)=>sc(b)-sc(a));used.add(c[0].n);return c[0].n};
 for(let i=0;i<n;i++){const d=add(from,i),k=dk(d);S.plan[k]=S.plan[k]||{};
  if(!S.plan[k].r)S.plan[k].r=pick("r",d);if(!S.plan[k].g)S.plan[k].g=pick("g",d)}sv()}
function done(n,k){if(!S.hist.some(h=>h.n==n&&h.d==k))S.hist.push({n,d:k});sv();draw()}
function rc(n,k,cb){const r=by(n);if(!r)return"";const b=bad(r),h=S.hist.some(x=>x.n==n&&x.d==k);
 return `<details class="c"><summary>${esc(n)}${r.a?'<span class="t">à l’avance</span>':""}${inSeason(r,TODAY)?"":'<span class="t">hors saison</span>'}</summary>
 ${b.length?`<div class="bad mu">Contient : ${esc(b.join(", "))}</div>`:""}
 <ul>${r.i.map(x=>`<li>${q1(x[1]*S.p)} ${x[2]} ${esc(x[0])}</li>`).join("")}</ul>
 <div class="row"><button class="s g" onclick="fv('${esc(n)}')">${S.fav.includes(n)?"★ Favori":"☆ Favori"}</button>${k?`<button class="s" onclick="done('${esc(n)}','${k}')">${h?"Fait ✓":"Marquer fait"}</button><button class="s g" onclick="swap('${k}','${r.t}')">Changer</button>`:""}</div></details>`}
function fv(n){S.fav=S.fav.includes(n)?S.fav.filter(x=>x!=n):S.fav.concat(n);sv();draw()}
function swap(k,t){const old=S.plan[k][t];delete S.plan[k][t];const d=new Date(k+"T12:00");S.hist.push({n:old,d:"1970-01-01"});S.plan[k][t]=null;
 S.hist.pop();const tmp=S.plan[k];const h=S.hist.slice();S.hist.push({n:old,d:k});gen(d,1);S.hist=h;sv();draw()}
// Courses
function need(){const m={};const days=[...Array(7)].map((_,i)=>dk(add(TODAY,i)));
 days.forEach(k=>{const p=S.plan[k];if(!p)return;[p.r,p.g].forEach(n=>{const r=n&&by(n);if(r)r.i.forEach(x=>{const id=x[0]+"|"+x[2];m[id]=m[id]||{n:x[0],u:x[2],r:x[3],q:0};m[id].q+=x[1]*S.p})})});
 const L=Object.values(m).map(o=>{const s=S.stock.find(z=>z.n.toLowerCase()==o.n.toLowerCase());if(s)o.q=Math.max(0,o.q-s.q);return o}).filter(o=>o.q>0);
 S.stock.filter(s=>s.q<s.min).forEach(s=>L.push({n:s.n,u:"",r:"E",q:s.min-s.q,c:1}));return L}
const shops=[["O","Lidl Caluire · œufs"],["F","Eau Vive Croix-Rousse · fruits et légumes bio"],["*","Auchan Drive Caluire · le reste (comparé à Intermarché Croix-Rousse)"]];

function tot(){let a=0,b=0;Object.entries(S.pr).forEach(([n,v])=>{if(document.getElementById("p_"+n)){a+=v[0];b+=v[1]}});const e=document.getElementById("cmp");
 if(e)e.textContent=a||b?`Auchan ${a.toFixed(2)} € · Intermarché ${b.toFixed(2)} € → ${a<=b?"Auchan":"Intermarché"} moins cher de ${Math.abs(a-b).toFixed(2)} €`:"Saisissez les prix pour comparer."}

function ln(o,price){return `<div class="row sp" style="padding:4px 0;border-bottom:1px solid var(--ln)"><label class="row"><input type="checkbox" style="width:auto" ${S.chk[o.n]?"checked":""} onchange="chk('${esc(o.n)}')"><span style="${S.chk[o.n]?"text-decoration:line-through":""}">${q1(o.q)} ${o.u} ${esc(o.n)}${o.c?' <span class="t">conso.</span>':""}</span></label>
 ${price?`<span id="p_${esc(o.n)}" class="row"><input class="n" inputmode="decimal" placeholder="Auch." value="${(S.pr[o.n]||[])[0]||""}" onchange="setp('${esc(o.n)}',0,this.value)"><input class="n" inputmode="decimal" placeholder="Inter." value="${(S.pr[o.n]||[])[1]||""}" onchange="setp('${esc(o.n)}',1,this.value)"></span>`:""}</div>`}

const V={
j(){const k=TK,p=S.plan[k]||{},nxt=[1,2,3].map(i=>dk(add(TODAY,i))).flatMap(d=>{const x=S.plan[d]||{};return[x.r,x.g].filter(Boolean).map(n=>({n,d})).filter(o=>by(o.n)&&by(o.n).a)});

 <label class="row mu" style="margin:6px 0"><input type="checkbox" id="ra" style="width:auto">Se prépare à l’avance</label><button onclick="addR()">Enregistrer</button></div>
 <h2>Mettre à jour le catalogue</h2><div class="c mu"><button onclick="maj(1)">Mettre à jour depuis internet</button> <span id="mj"></span></div><h2>Importer des recettes</h2><div class="c mu">Ou collez ici un lot de recettes au format JSON :<textarea id="ij" rows="3" style="margin:6px 0"></textarea><button class="g" onclick="imp()">Importer</button></div>`},
a(){const ls=(t,a,ph)=>`<div class="c"><b>${t}</b><div class="row" style="margin:6px 0">${S[a].map((x,i)=>`<button class="s g" onclick="S.${a}.splice(${i},1);sv();draw()">${esc(x)} ✕</button>`).join("")||'<span class="mu">Vide</span>'}</div><div class="row"><input id="i_${a}" placeholder="${ph}" style="flex:1"><button onclick="ad('${a}')">Ajouter</button></div></div>`;
 return `<h1>Aliments</h1>${ls("Favoris (proposés plus souvent)","ff","ex. lentilles")}${ls("À éviter (aucune recette qui en contient)","av","ex. foie")}<div class="mu">La liste de départ reprend des aliments souvent cités pour leur cadmium (abats, coquillages, crustacés, algues, graines de tournesol et de lin, cacao, épinards). Elle est indicative : la teneur dépend aussi de l’origine et des sols. Pour un avis adapté à votre situation, voyez un professionnel de santé.</div>`},
c(){const L=need();const g=s=>L.filter(o=>s=="O"?o.r=="O"&&!o.c:s=="F"?o.r=="F"&&!o.c:o.r!="O"&&o.r!="F"||o.c);
 return `<h1>Courses</h1><div class="mu">Pour 7 jours, ${S.p} pers., stock déduit. Privilégiez le bio et la saison.</div>${L.length?shops.map(([s,t])=>{const l=g(s);return l.length?`<h2>${t}</h2><div class="c">${l.map(o=>ln(o,s=="*")).join("")}</div>`:""}).join(""):'<div class="c">Liste vide. Planifiez des repas.</div>'}
 <div class="c mu" id="cmp"></div><div class="row"><input class="n" id="tt" inputmode="decimal" placeholder="Total €" style="width:110px"><button onclick="spend()">Ajouter aux dépenses</button></div>`},
s(){return `<h1>Stock</h1><div class="mu">Un article sous son seuil passe dans les courses.</div>${S.stock.map((s,i)=>`<div class="c row sp"><span>${esc(s.n)}${s.c?' <span class="t">conso.</span>':""}</span><span class="row"><input class="n" inputmode="decimal" value="${s.q}" onchange="S.stock[${i}].q=parseFloat(this.value)||0;sv();draw()"><span class="mu">seuil</span><input class="n" inputmode="decimal" value="${s.min}" onchange="S.stock[${i}].min=parseFloat(this.value)||0;sv()"><button class="s g" onclick="S.stock.splice(${i},1);sv();draw()">✕</button></span></div>`).join("")}
 <div class="c row"><input id="sn" placeholder="Article" style="flex:1"><select id="sc" style="width:auto"><option value="0">Aliment</option><option value="1">Conso.</option></select><button onclick="addS()">Ajouter</button></div>`},
b(){const sp=S.bud.sp.reduce((a,x)=>a+x.v,0),pc=Math.min(100,sp/(S.bud.w||1)*100);return `<h1>Budget</h1><div class="c"><div class="row sp"><b>Budget de la semaine</b><span class="row"><input class="n" inputmode="decimal" value="${S.bud.w}" onchange="S.bud.w=parseFloat(this.value)||0;sv();draw()">€</span></div>
 <div class="bar" style="margin:10px 0"><i style="width:${pc}%"></i></div><b class="${sp>S.bud.w?"bad":""}">${sp.toFixed(2)} € dépensés</b> <span class="mu">· reste ${(S.bud.w-sp).toFixed(2)} €</span></div>
 <div class="c row"><input id="bl" placeholder="Libellé" style="flex:1"><input class="n" id="bv" inputmode="decimal" placeholder="€"><button onclick="spend2()">Ajouter</button></div>
 ${S.bud.sp.map((x,i)=>`<div class="row sp mu"><span>${x.d} · ${esc(x.l)}</span><span>${x.v.toFixed(2)} € <button class="s g" onclick="S.bud.sp.splice(${i},1);sv();draw()">✕</button></span></div>`).join("")}
 <button class="g" style="margin-top:10px" onclick="S.bud.sp=[];sv();draw()">Remettre à zéro</button>`}};
function ad(a){const v=document.getElementById("i_"+a).value.trim();if(v){S[a].push(v);sv();draw()}}
function addS(){const n=sn.value.trim();if(n){S.stock.push({n,q:0,min:1,c:+sc.value});sv();draw()}}
function spend(){const v=parseFloat(tt.value);if(v>0){S.bud.sp.push({d:TK,l:"Courses",v});sv();S.tab="b";draw()}}
function spend2(){const v=parseFloat(bv.value);if(v>0){S.bud.sp.push({d:TK,l:bl.value||"Dépense",v});sv();draw()}}
function addR(){const n=rn.value.trim(),i=ri.value.split("\n").map(l=>l.split(",").map(x=>x.trim())).filter(x=>x[0]).map(x=>[x[0],parseFloat(x[1])||1,x[2]||"pc",(x[3]||"E").toUpperCase()]);
 if(!n||!i.length)return;S.cus.push({n,t:rt.value,m:rm.value.split(",").map(x=>parseInt(x)).filter(x=>x>0&&x<13),a:ra.checked?1:0,i});sv();draw()}
function imp(){try{const a=JSON.parse(ij.value);a.filter(r=>r.n&&r.i&&r.t).forEach(r=>{r.m=r.m||[];if(!by(r.n))S.cus.push(r)});sv();draw()}catch(e){alert("JSON invalide")}}
const TABS=[["j","Jour"],["p","Planning"],["r","Recettes"],["a","Aliments"],["c","Courses"],["s","Stock"],["b","Budget"]];
function draw(keep){const y=scrollY;document.getElementById("app").innerHTML=V[S.tab]();
 nav.innerHTML=TABS.map(([k,t])=>`<button class="${k==S.tab?"on":""}" onclick="S.tab='${k}';draw();scrollTo(0,0)">${t}</button>`).join("");
 if(keep){const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}scrollTo(0,y);if(S.tab=="c")tot()}
async function maj(v){const e=document.getElementById("mj");try{const r=await fetch("recettes.json?"+Date.now());const a=await r.json();let n=0;a.filter(x=>x.n&&x.i&&x.t).forEach(x=>{x.m=x.m||[];if(!by(x.n)){S.cus.push(x);n++}});sv();if(e)e.textContent=n+" recette(s) ajoutée(s)";if(n&&S.tab!="r"||n&&!v)draw()}catch(x){if(e)e.textContent="Hors ligne ou fichier introuvable"}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.onLine)maj(0);
draw();
</script></body></html>
